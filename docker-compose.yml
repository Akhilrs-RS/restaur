version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restopulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend/RestaurantApi
      dockerfile: Dockerfile
    ports:
      - "5555:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=restopulse;Username=postgres;Password=postgres;
    depends_on:
      - db

volumes:
  postgres_data:
